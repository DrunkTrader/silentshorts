# Lint gate for CI (.github/workflows/ci.yml). It only fails on real errors:
# syntax errors, undefined names, invalid comparisons. Style and unused-import
# rules are left off on purpose: 35 unused imports in app.py are names that
# tests reach through `app_module.<name>` (monkeypatching), so "fixing" them in
# bulk would break the suite. Widen the rule set one rule at a time.
extend-exclude = ["dashboard", "remotion", "render-service", "osrender", ".venv", ".venv-ci", "output", "uploads"]

[lint]
select = ["E9", "F63", "F7", "F82"]
