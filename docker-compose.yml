services:
  backend:
    build: .
    container_name: silentshorts-backend
    ports:
      # Loopback only: the API has no login in self-host mode. To reach it from
      # another machine put a reverse proxy with authentication in front, or
      # change this to "8000:8000" knowing anyone on the network can use it.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: silentshorts-frontend
    ports:
      # Loopback only: the dev server proxies /api to the backend, so exposing
      # it exposes the API too (see the backend note above).
      - "127.0.0.1:5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: silentshorts-renderer
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
