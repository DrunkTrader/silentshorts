[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silentshorts"
version = "0.1.0"
description = "CLI for SilentShorts: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SilentShorts" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://www.drunktrader.dev"
Source = "https://github.com/DrunkTrader/silentshorts"
Documentation = "https://www.drunktrader.dev/mcp"

[project.scripts]
silentshorts = "silentshorts_cli:main"

[tool.setuptools]
py-modules = ["silentshorts_cli"]
